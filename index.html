<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wings over Isonzo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2026; color: #fff; font: 15px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #c, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  #ui { display: none; pointer-events: none; }
  .panel { position: fixed; background: rgba(16, 22, 28, .72); border-radius: 4px; padding: 8px 12px; }
  #score { top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; align-items: baseline; font-weight: 700; font-size: 19px; white-space: nowrap; }
  #score small { font-weight: 400; font-size: 12px; opacity: .8; }
  #stats { left: 18px; bottom: 18px; min-width: 150px; }
  #feed { position: fixed; top: 12px; right: 18px; text-align: right; font-size: 13.5px; text-shadow: 0 1px 3px #000; }
  #msg { position: fixed; top: 30%; left: 0; right: 0; text-align: center; font: 700 34px Georgia, serif; text-shadow: 0 2px 10px #000; }
  #msg small { display: block; font: 400 16px Inter, system-ui, sans-serif; margin-top: 4px; }
  #help { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 12.5px; opacity: .85; text-shadow: 0 1px 3px #000; white-space: nowrap; }
  #netinfo { position: fixed; top: 14px; left: 18px; font-size: 12.5px; opacity: .85; text-shadow: 0 1px 3px #000; }
  #lobby { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(rgba(12, 16, 20, .25), rgba(12, 16, 20, .7)); padding: 16px; overflow: auto; }
  form { width: min(430px, 100%); background: #efe6cf; color: #1d1b16; border-radius: 6px; padding: 26px 28px 22px; box-shadow: 0 12px 50px rgba(0, 0, 0, .5); box-sizing: border-box; }
  form .k { font: 600 12px Inter, system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #8a5a1c; }
  h1 { font: 700 38px/1.05 Georgia, serif; margin: 4px 0 6px; }
  form p { margin: 0 0 16px; color: #3a362c; font-size: 14.5px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 4px; }
  label small { font-weight: 400; color: #5b5444; }
  input, select { width: 100%; box-sizing: border-box; font: inherit; padding: 9px 10px; border: 1.5px solid #b9ab86; border-radius: 4px; background: #fbf6e6; color: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { margin-top: 18px; width: 100%; font: 700 16px Inter, system-ui, sans-serif; padding: 12px; border: 0; border-radius: 4px; background: #1d1b16; color: #efe6cf; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  details { margin-top: 12px; font-size: 13px; color: #3a362c; }
  #status { min-height: 20px; margin-top: 10px; font-size: 13.5px; color: #8a1d17; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="hud"></canvas>
<div id="ui">
  <div id="score" class="panel"></div>
  <div id="stats" class="panel"></div>
  <div id="feed"></div>
  <div id="msg"></div>
  <div id="netinfo"></div>
  <div id="help">W/S or ↑/↓ pitch · A/D or ←/→ roll · Q/E rudder · Shift / Ctrl throttle · Space or mouse to fire</div>
</div>
<div id="lobby">
  <form id="form" autocomplete="off">
    <div class="k">Isonzo Front · 1917</div>
    <h1>Wings over Isonzo</h1>
    <p>Team dogfight, up to 6 v 6. Everyone who enters the same squadron password flies in the same battle. Leave it empty to fly solo against bots.</p>
    <label for="name">Callsign</label>
    <input id="name" maxlength="20" required>
    <label for="pw">Squadron password <small>— share it with your friends</small></label>
    <input id="pw" maxlength="64" placeholder="empty = solo flight">
    <div class="row">
      <div><label for="team">Side</label>
        <select id="team"><option value="auto">Auto-balance</option><option value="it">Italy — SPAD VII</option><option value="ah">Austria-Hungary — Albatros D.III</option></select></div>
      <div><label for="size">Pilots per side <small>(bots fill)</small></label>
        <select id="size"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div>
    </div>
    <details><summary>Connection options</summary>
      <label for="relay">WebSocket relay <small>— only if peer-to-peer fails; everyone must use the same one</small></label>
      <input id="relay" placeholder="wss://your-relay.example">
    </details>
    <button id="go">Take off</button>
    <div id="status" role="status"></div>
  </form>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
